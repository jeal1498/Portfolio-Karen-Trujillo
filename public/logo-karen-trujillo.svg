<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" role="img" aria-label="Karen Trujillo — Neuropsicóloga Clínica">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&amp;display=swap');
      .logo-name { font-family: 'Outfit', sans-serif; font-weight: 700; fill: #433860; }
      .logo-tag  { font-family: 'Outfit', sans-serif; font-weight: 400; fill: #433860; font-size: 7px; letter-spacing: 0.08em; }
    </style>

    <!-- Circular path for arc text -->
    <path id="arc" d="M 100,60 m -42,0 a 42,42 0 1,1 84,0" fill="none"/>
  </defs>

  <!-- ── Wordmark ── -->
  <text class="logo-name" font-size="32" x="0" y="46" letter-spacing="-0.5">Karen</text>
  <text class="logo-name" font-size="32" x="0" y="82" letter-spacing="-0.5">Trujillo</text>

  <!-- Decorative dot between name and illustration -->
  <circle cx="151" cy="60" r="1.5" fill="#433860" opacity="0.4"/>

  <!-- ── Illustration: hand holding dandelion ── -->
  <g transform="translate(163, 8)">

    <!-- Dandelion stem -->
    <line x1="49" y1="96" x2="49" y2="42" stroke="#433860" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Dandelion bloom rays -->
    <g stroke="#433860" stroke-width="0.9" stroke-linecap="round" opacity="0.85">
      <!-- center dot -->
      <circle cx="49" cy="38" r="2" fill="#433860"/>
      <!-- rays -->
      <line x1="49" y1="36" x2="49" y2="28"/>
      <line x1="49" y1="40" x2="49" y2="48"/>
      <line x1="47" y1="36.5" x2="41" y2="30"/>
      <line x1="51" y1="36.5" x2="57" y2="30"/>
      <line x1="46.5" y1="38" x2="38.5" y2="36"/>
      <line x1="51.5" y1="38" x2="59.5" y2="36"/>
      <line x1="47" y1="39.5" x2="41" y2="46"/>
      <line x1="51" y1="39.5" x2="57" y2="46"/>
      <!-- floating seeds -->
      <circle cx="49" cy="27" r="1.2" fill="#433860"/>
      <circle cx="41" cy="29" r="1" fill="#433860"/>
      <circle cx="57" cy="29" r="1" fill="#433860"/>
      <circle cx="38.5" cy="35.5" r="1" fill="#433860"/>
      <circle cx="59.5" cy="35.5" r="1" fill="#433860"/>
      <circle cx="40.5" cy="46.5" r="1" fill="#433860"/>
      <circle cx="57.5" cy="46.5" r="1" fill="#433860"/>
      <circle cx="49" cy="49" r="1" fill="#433860"/>
    </g>

    <!-- Floating detached seeds -->
    <g fill="#433860" opacity="0.5">
      <circle cx="30" cy="18" r="0.9"/>
      <circle cx="70" cy="22" r="0.8"/>
      <circle cx="76" cy="14" r="0.7"/>
      <circle cx="22" cy="30" r="0.7"/>
    </g>

    <!-- Hand (simplified elegant outline) -->
    <g fill="none" stroke="#433860" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
      <!-- Palm -->
      <path d="M 36,96 C 34,88 33,80 34,72 C 34,68 36,66 39,66 L 42,66 C 42,62 44,60 47,60 C 50,60 51,62 51,66 C 54,65 56,66 57,69 C 59,68 62,69 62,73 L 62,80 C 64,80 65,82 64,85 L 62,96 Z"/>
      <!-- Index finger extended up (holding stem) -->
      <line x1="47" y1="60" x2="47" y2="96"/>
      <!-- Thumb detail -->
      <path d="M 36,80 C 33,78 31,74 33,71 C 35,68 38,68 39,70"/>
    </g>

    <!-- Sparkles -->
    <g fill="#433860" opacity="0.6">
      <!-- 4-pointed star top-right -->
      <path d="M 72,8 L 73.2,11 L 76,12 L 73.2,13 L 72,16 L 70.8,13 L 68,12 L 70.8,11 Z" transform="scale(0.7) translate(32, -2)"/>
      <!-- Small dot sparkle -->
      <circle cx="20" cy="55" r="1.2"/>
      <circle cx="79" cy="55" r="1"/>
      <circle cx="15" cy="42" r="0.8"/>
    </g>

    <!-- Circular arc text: "· Neuropsicóloga Clínica ·" -->
    <path id="circle-arc" d="M 49,103 m -44,0 a 44,44 0 0,1 88,0" fill="none"/>
    <text font-family="'Outfit', sans-serif" font-size="6.2" font-weight="400" fill="#433860" letter-spacing="1.5" opacity="0.85">
      <textPath href="#circle-arc" startOffset="8%">· Neuropsicóloga Clínica ·</textPath>
    </text>
  </g>
</svg>
